<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certification Study Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#1E5AA8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light dark;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEDF2; --ink:#16202C; --muted:#5C6773; --line:#DCE1E7;
  --accent:#1E5AA8; --accent-ink:#0F3A73; --accent-bg:#E7EFFA;
  --good:#157F5B; --good-bg:#E4F5EE; --good-line:#B7E1CE;
  --bad:#C6473F; --bad-bg:#FBEAE8; --bad-line:#E7B9B4;
  --amber:#9A6B12; --amber-bg:#FBF0DA;
  --shadow: 0 1px 2px rgba(20,30,45,.06), 0 1px 1px rgba(20,30,45,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#161D26; --surface-2:#1D2530; --ink:#E7ECF2; --muted:#95A1AF; --line:#2A323D;
    --accent:#7AB0EC; --accent-ink:#CFE3FA; --accent-bg:#152738;
    --good:#4FCC97; --good-bg:#122A22; --good-line:#1F4738;
    --bad:#E58C86; --bad-bg:#2A1613; --bad-line:#5A2A26;
    --amber:#E3AE5C; --amber-bg:#2C230F;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#161D26; --surface-2:#1D2530; --ink:#E7ECF2; --muted:#95A1AF; --line:#2A323D;
  --accent:#7AB0EC; --accent-ink:#CFE3FA; --accent-bg:#152738;
  --good:#4FCC97; --good-bg:#122A22; --good-line:#1F4738;
  --bad:#E58C86; --bad-bg:#2A1613; --bad-line:#5A2A26;
  --amber:#E3AE5C; --amber-bg:#2C230F;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans KR",system-ui,sans-serif;padding-inline:16px;line-height:1.55}
.mono{font-family:"IBM Plex Mono",ui-monospace,"IBM Plex Sans KR",monospace}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 60px}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
header.top h1{font-size:1.5rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top p.sub{margin:0;color:var(--muted);font-size:.92rem}

/* Header pills (same on every page): 36px tall, round icon, bold label. Accent = navigation, quiet = support. */
.toplinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;max-width:100%;padding:0 14px 0 4px;border-radius:999px;
  font-size:.85rem;text-decoration:none;white-space:nowrap;transition:border-color .15s ease,box-shadow .15s ease,color .15s ease}
.pill .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:.9rem;flex:none}
.pill b{font-weight:700}
.pill.accent{background:var(--accent-bg);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-ink)}
.pill.accent .ic{background:var(--surface)}
.pill.quiet{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.pill.quiet .ic{background:var(--surface-2)}
.pill:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill .desc{color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .arr{transition:transform .15s ease;flex:none}
.pill:hover .arr{transform:translateX(3px)}
@media (max-width:520px){.pill .desc{display:none}}
@media (prefers-reduced-motion: reduce){.pill,.pill .arr{transition:none}}

/* Baseline drawn as an inset shadow (not a border + -1px tab margin), so nothing overflows and no scrollbar appears. */
.vendortabs{display:flex;gap:4px;box-shadow:inset 0 -1px 0 var(--line);margin-top:4px;overflow-x:auto;scrollbar-width:none}
.vendortabs::-webkit-scrollbar{display:none}
/* Phones: with three vendors the tab counts no longer fit beside the star, so they are hidden (as on the level buttons). */
@media (max-width:520px){.vtab{padding:8px 10px 7px}.vtab .cnt{display:none}}
.vtab{font:inherit;font-size:.95rem;font-weight:600;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px 7px;cursor:pointer;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.vtab .cnt{font-size:.74rem;font-weight:500;font-variant-numeric:tabular-nums;opacity:.8}
.vtab:hover{color:var(--ink)}
.vtab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.vtab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
/* Level picker: a segmented control under the vendor tabs (same as the question bank). */
.levelseg{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:10px;max-width:100%;overflow-x:auto}
.levelseg[hidden]{display:none}
.lseg{font:inherit;font-size:.82rem;font-weight:600;background:none;border:none;border-radius:7px;color:var(--muted);padding:6px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.lseg .cnt{font-size:.72rem;font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.lseg:hover{color:var(--ink)}
.lseg[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow)}
.lseg:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chiprow{padding-block:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip .nm{font-family:"IBM Plex Sans","IBM Plex Sans KR",system-ui,sans-serif;font-weight:400;margin-left:6px;opacity:.85}
.chip{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:.76rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip .cd{display:inline-flex;align-items:center;gap:6px}
.chip .new{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.6rem;font-weight:700;letter-spacing:.05em;color:var(--accent-ink);background:var(--accent-bg);border:1px solid var(--accent);border-radius:4px;padding:0 4px;line-height:1.5}
@media (hover:hover){.chip:hover{border-color:var(--accent)}}
/* Phones: exam chips become two-column tiles (code above, name below), as in the question bank. */
@media (max-width:520px){
  #examRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  #examRow .chip{border-radius:10px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
  #examRow .chip .nm{margin-left:0;font-size:.74rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
.chip.active{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,.navbtn:focus-visible,.daylink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.daybar{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.navbtn{font:inherit;font-size:.82rem;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.navbtn:hover:not(:disabled){border-color:var(--accent)}
.navbtn:disabled{opacity:.4;cursor:default}
details.daynav{flex:1;min-width:0;position:relative}
details.daynav>summary{list-style:none;cursor:pointer;font-size:.85rem;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.daynav>summary::-webkit-details-marker{display:none}
details.daynav[open]>summary{border-color:var(--accent);color:var(--ink)}
.daypanel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px 0}
.daygroup h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 14px 4px;font-weight:600}
.daylink{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;font:inherit;font-size:.86rem;background:none;border:none;color:var(--ink);padding:6px 14px;cursor:pointer}
.daylink:hover{background:var(--surface-2)}
.daylink.current{background:var(--accent-bg);color:var(--accent-ink)}
.daylink .n{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:.76rem;color:var(--muted);min-width:3.2em}
.daylink .ck{margin-left:auto;color:var(--good);font-size:.8rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.eyebrow{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:.74rem;color:var(--muted);letter-spacing:.02em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dbadge{background:var(--accent-bg);color:var(--accent-ink);border-radius:5px;padding:1px 7px;font-weight:600}
.daytitle{font-size:1.35rem;line-height:1.3;margin:8px 0 10px;text-wrap:balance}
.svcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.svc{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:.72rem;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.label{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.concept{margin-bottom:16px}
.concept h3{font-size:1rem;margin:0 0 4px}
.concept p{margin:0;font-size:.94rem;text-wrap:pretty}
.points{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.points li{background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 14px;font-size:.92rem}
.recap{background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:.92rem}

.quiz-q{margin-bottom:18px}
.quiz-q .q{font-weight:600;margin:0 0 8px;font-size:.95rem}
.choice{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:.9rem;line-height:1.45;padding:8px 10px;margin-bottom:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.choice .k{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;color:var(--muted);flex:none}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--good-bg);border-color:var(--good-line);font-weight:600}
.choice.incorrect{background:var(--bad-bg);border-color:var(--bad-line)}
.choice.dim{opacity:.55}
.explain{border-radius:8px;padding:10px 14px;font-size:.87rem;background:var(--good-bg);border:1px solid var(--good-line)}
.explain.wrong{background:var(--bad-bg);border-color:var(--bad-line)}
.explain b{display:block;margin-bottom:4px}
.retry{font:inherit;font-size:.78rem;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:6px 0 0}

.dayfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
.donebtn{font:inherit;font-size:.85rem;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--good);background:transparent;color:var(--good);cursor:pointer}
.donebtn[aria-pressed="true"]{background:var(--good);color:var(--surface)}
.qblink{font-size:.85rem;color:var(--accent);margin-left:auto}
.concept p,.points li,.recap,.choice,.explain,.daytitle{overflow-wrap:anywhere}

/* Glossary terms: dotted underline only, so marked text still reads as body text. */
.term{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:help;text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:2px}
.term:hover,.term[aria-expanded="true"]{color:var(--accent-ink);background:var(--accent-bg)}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.termpop{position:fixed;z-index:40;width:min(440px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:12px 14px;font-size:.86rem;line-height:1.5}
.termpop[hidden]{display:none}
.termpop .tp-head{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.termpop .tp-head b{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;color:var(--accent-ink);font-size:.86rem}
.termpop p{margin:0}
.termpop .tp-ko{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);word-break:keep-all;overflow-wrap:anywhere}
.loading,.empty{color:var(--muted);font-size:.9rem;padding:24px 0}
.footnote{margin-top:24px;font-size:.78rem;color:var(--muted);text-align:center}
/* Compact day bar: appears once the day navigation scrolls away (same look as the question bank's exam bar). */
.exambar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  transform:translateY(-110%);transition:transform .18s ease;pointer-events:none}
.exambar.show{transform:none;pointer-events:auto}
.exambar-inner{max-width:760px;width:100%;display:flex;align-items:center;gap:8px;min-width:0}
.exambar .code{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-weight:600;font-size:.8rem;color:var(--accent-ink);
  background:var(--accent-bg);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;white-space:nowrap}
.exambar .name{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.exambar button,.exambar .barsupport{font:inherit;font-size:.76rem;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;text-decoration:none}
.exambar button:disabled{opacity:.4;cursor:default}
.exambar .barsupport{color:var(--muted)}
.exambar .barsupport:hover{color:var(--accent);border-color:var(--accent)}
.totop{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:1.1rem;cursor:pointer;
  opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease;pointer-events:none}
.totop.show{opacity:1;transform:none;pointer-events:auto}
@media (prefers-reduced-motion: reduce){.exambar,.totop{transition:none}}
@media (max-width:520px){.exambar .barsupport .t{display:none}.card{padding:16px}.navbtn .t{display:none}.lseg{padding:6px 9px}.lseg .cnt{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Certification Study Guide</h1>
    <p class="sub">Day-by-day plans for AWS, Palantir and Azure exams. Unofficial.</p>
    <nav class="toplinks"><a class="pill accent backlink" href="./"><span class="ic" aria-hidden="true">←</span><b>Question bank</b></a><a class="pill quiet supportlink" href="support.html"><span class="ic" aria-hidden="true">☕</span><b>Support this site</b></a></nav>
  </header>
  <div class="vendortabs" id="vendorRow" role="tablist" aria-label="Certification vendor"></div>
  <div class="levelseg" id="levelRow" aria-label="Certification level" hidden></div>
  <div class="chiprow" id="examRow" aria-label="Exam"></div>
  <div class="exambar" id="dayBar" aria-hidden="true"><div class="exambar-inner"><span class="code" id="dayBarCode"></span><span class="name" id="dayBarName"></span><button type="button" id="barPrev" tabindex="-1" aria-label="Previous day">←</button><button type="button" id="barNext" tabindex="-1" aria-label="Next day">→</button><a class="barsupport" href="support.html" tabindex="-1" aria-label="Support this site" title="Support this site">☕<span class="t"> Support</span></a></div></div>
  <button class="totop" id="toTop" type="button" aria-label="Back to top" title="Back to top" tabindex="-1">↑</button>
  <main id="main"><div class="loading">Loading…</div></main>
  <p class="footnote">Progress is saved in this browser only.</p>
</div>
<script src="js/study.js?v=21f4a7d897"></script>
</body>
</html>
